<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaierSpeedTest</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="wordmark">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 12 L17.6 6.4" fill="none" stroke="currentColor"
              stroke-width="2.1" stroke-linecap="round"/>
      </svg>
      <span>TAIERSPEEDTEST</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="moreBtn" aria-label="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" fill="none"/>
          <circle cx="9" cy="7" r="2.1" fill="currentColor"/>
          <circle cx="15" cy="12" r="2.1" fill="currentColor"/>
          <circle cx="8.5" cy="17" r="2.1" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="metrics">
    <div class="metric" id="mPingBox">
      <div class="metric-head">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.9" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <circle cx="8" cy="8" r="2.1" fill="currentColor"/>
        </svg>
        <span>PING</span>
      </div>
      <div class="metric-num" id="mPing">&hellip;</div>
    </div>

    <div class="metric" id="mDownBox">
      <div class="metric-head">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.9" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <path d="M8 4.5V11.2M5 8.3L8 11.2l3-2.9" fill="none" stroke="currentColor"
                stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>下载</span>
      </div>
      <div class="metric-num" id="mDown">&hellip;</div>
    </div>

    <div class="metric" id="mUpBox">
      <div class="metric-head">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.9" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <path d="M8 11.5V4.8M5 7.7L8 4.8l3 2.9" fill="none" stroke="currentColor"
                stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>上传</span>
      </div>
      <div class="metric-num" id="mUp">&hellip;</div>
    </div>
  </section>

  <section class="dial-area">
    <div class="dial mode-start" id="dialBox">
      <div class="ripple"></div>
      <div class="ripple r2"></div>
      <div class="ring ring-inner"></div>
      <canvas id="gaugeCanvas" aria-hidden="true"></canvas>
      <div class="dial-start">开始</div>
      <div class="gauge-value">
        <div class="gv-num" id="gvNum">0.00</div>
        <div class="gv-unit">
          <span class="gv-icon" id="gvIcon"></span>
          <span id="gvUnit">兆/秒</span>
        </div>
      </div>
    </div>
  </section>

  <section class="servers">
    <div class="server-row link" id="serverRow" role="button" tabindex="0">
      <span class="server-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <path d="M2.2 12h19.6M12 2.2c2.6 2.7 4 6.2 4 9.8s-1.4 7.1-4 9.8c-2.6-2.7-4-6.2-4-9.8s1.4-7.1 4-9.8z"
                fill="none" stroke="currentColor" stroke-width="1.3"/>
        </svg>
      </span>
      <span class="server-text">
        <span class="server-name link" id="srvName">正在载入节点…</span>
        <span class="server-sub" id="srvSub">—</span>
      </span>
      <span class="server-chev">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9.5 5.5L16 12l-6.5 6.5" fill="none" stroke="currentColor"
                stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>

    <div class="server-row static">
      <span class="server-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M7.4 9.2h9.2M7.4 9.2l2.4-2.4M16.6 14.8H7.4M16.6 14.8l-2.4 2.4"
                fill="none" stroke="currentColor" stroke-width="1.35"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="server-text">
        <span class="server-name" id="ispName">—</span>
      </span>
    </div>
  </section>

  <div class="sheet-mask" id="sheetMask"></div>

  <div class="sheet" id="nodeSheet">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title">选择测速节点</h2>
    <div class="sheet-body">
      <label class="field">
        <span>省份</span>
        <div class="select-wrap"><select id="selProv"></select></div>
      </label>
      <label class="field">
        <span>运营商</span>
        <div class="select-wrap"><select id="selOper"></select></div>
      </label>
      <label class="field">
        <span>节点</span>
        <div class="select-wrap"><select id="selNode"></select></div>
      </label>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="sheetCancel">取消</button>
      <button class="btn primary" id="sheetConfirm">使用此节点</button>
    </div>
  </div>

  <div class="sheet" id="menuSheet">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title">设置</h2>
    <div class="sheet-body menu-list">
      <button class="menu-item" id="menuPingOnly">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.9" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <circle cx="8" cy="8" r="2.1" fill="currentColor"/>
        </svg>
        <span>仅测延迟</span>
      </button>
      <button class="menu-item" id="menuDownOnly">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.9" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <path d="M8 4.5V11.2M5 8.3L8 11.2l3-2.9" fill="none" stroke="currentColor"
                stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>仅测下载</span>
      </button>
      <button class="menu-item" id="menuUpOnly">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.9" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <path d="M8 11.5V4.8M5 7.7L8 4.8l3 2.9" fill="none" stroke="currentColor"
                stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>仅测上传</span>
      </button>
      <button class="menu-item" id="menuRefresh">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3.2h-3.2" fill="none"
                stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>刷新节点列表</span>
      </button>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost full" id="menuClose">关闭</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
